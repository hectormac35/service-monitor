services:
  service-monitor:
    build: .
    container_name: service-monitor-app
    environment:
      DATABASE_URL: sqlite:////app/data/service_monitor.db
      CORS_ORIGINS: http://localhost:3001
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8002:8000"
    volumes:
      - monitor-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8002
        NEXT_PUBLIC_GRAFANA_URL: http://localhost:3000
    container_name: service-monitor-frontend
    ports:
      - "3001:3000"
    depends_on:
      service-monitor:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: service-monitor-prometheus
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - service-monitor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: service-monitor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cambia-esta-clave}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-monitor.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  monitor-data:
  prometheus-data:
  grafana-data:
